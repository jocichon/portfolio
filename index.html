<!DOCTYPE html>
<!--
  File:        index.html
  Project:     Jo Cichon Portfolio (https://jocichon.github.io/portfolio/)
  Author:      Jo Cichon
  Description: Portfolio home page. Hero section with name and titles,
               followed by filterable project cards rendered from
               projects.js by script.js. Cards link to project.html.
  Styles:      style.css
  Scripts:     projects.js (data), common.js (shared helpers),
               script.js (card rendering, filters)
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jo Cichon Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="projects.js" defer></script>
    <script src="common.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<header class="hero">
    <div class="hero-content">
        <h1>Jo Cichon</h1>
        <h2>Software Engineer • AI Ethics Researcher • Project Manager</h2>
    </div>

    <!-- Filter tabs along the hero's bottom edge; buttons built by script.js -->
    <nav class="project-filters" aria-label="Filter projects"></nav>
</header>

<main id="projects">

    <!--
      PROJECTS
      All project content lives in projects.js. script.js builds the
      filter buttons (in the header) and project cards from it at page load.
    -->
    <p class="no-projects" hidden>No projects in this category yet.</p>

    <div id="project-list"></div>

    <noscript>
        <p class="no-projects">Enable JavaScript to view projects.</p>
    </noscript>

</main>

</body>
</html>
