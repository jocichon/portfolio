<!DOCTYPE html>
<!--
  File:        index.html
  Project:     Jo Cichon Portfolio (https://jocichon.github.io/portfolio/)
  Author:      Jo Cichon
  Description: Portfolio home page. Site navigation (About, GitHub,
               LinkedIn, Medium), hero section with name and titles,
               followed by filterable project cards rendered from
               projects.js by script.js. Cards link to project.html.
  Styles:      style.css
  Scripts:     projects.js (data), common.js (shared helpers),
               script.js (card rendering, filters)
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jo Cichon Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="projects.js" defer></script>
    <script src="common.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<header class="hero">
    <!-- Site navigation: keep in sync across index.html, about.html, project.html -->
    <nav class="site-nav" aria-label="Site">
        <a href="index.html" aria-current="page">Projects</a>
        <a href="about.html">About</a>
        <a href="https://github.com/jocichon" target="_blank" rel="noopener noreferrer">GitHub<span class="visually-hidden"> (opens in a new tab)</span></a>
        <a href="https://www.linkedin.com/in/jo-cichon/" target="_blank" rel="noopener noreferrer">LinkedIn<span class="visually-hidden"> (opens in a new tab)</span></a>
        <a href="https://medium.com/@jorichescichon" target="_blank" rel="noopener noreferrer">Medium<span class="visually-hidden"> (opens in a new tab)</span></a>
    </nav>

    <div class="hero-content">
        <h1>Jo Cichon</h1>
        <h2>Software Engineer • AI Ethics Researcher • Project Manager</h2>
    </div>

    <!-- Filter tabs along the hero's bottom edge; buttons built by script.js -->
    <nav class="project-filters" aria-label="Filter projects"></nav>
</header>

<main id="projects">

    <!--
      PROJECTS
      All project content lives in projects.js. script.js builds the
      filter buttons (in the header) and project cards from it at page load.
    -->
    <p class="no-projects" hidden>No projects in this category yet.</p>

    <div id="project-list"></div>

    <noscript>
        <p class="no-projects">Enable JavaScript to view projects.</p>
    </noscript>

</main>

</body>
</html>
